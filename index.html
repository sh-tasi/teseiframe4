<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iframe Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .toolbar {
      padding: 12px 16px;
      background: #1b1b1b;
      border-bottom: 1px solid #333;
    }

    .toolbar h1 {
      margin: 0 0 6px;
      font-size: 18px;
    }

    .toolbar p {
      margin: 0;
      font-size: 14px;
      color: #bbb;
      word-break: break-all;
    }

    .frame-wrap {
      flex: 1;
      min-height: 0;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <h1>Iframe 測試頁</h1>
      <p>目標網址：https://www.one21.live</p>
    </div>
    <div class="frame-wrap">
      <iframe
        src="https://www.one21.live"
        title="one21 iframe test"
        allowfullscreen
      ></iframe>
    </div>
  </div>
</body>
</html>
